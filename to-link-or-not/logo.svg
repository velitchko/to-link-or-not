<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="80" height="80" rx="12" fill="url(#bg)"/>

  <!-- Peripheral edges (lighter) -->
  <line x1="40" y1="13" x2="64" y2="27" stroke="white" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="62" y1="54" x2="40" y2="66" stroke="white" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="16" y1="27" x2="18" y2="54" stroke="white" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Hub edges -->
  <line x1="40" y1="40" x2="40" y2="13" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>
  <line x1="40" y1="40" x2="64" y2="27" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>
  <line x1="40" y1="40" x2="62" y2="54" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>
  <line x1="40" y1="40" x2="40" y2="66" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>
  <line x1="40" y1="40" x2="16" y2="27" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>
  <line x1="40" y1="40" x2="18" y2="54" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Peripheral nodes -->
  <circle cx="40" cy="13" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="64" cy="27" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="62" cy="54" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="40" cy="66" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="16" cy="27" r="5" fill="white" fill-opacity="0.85"/>
  <circle cx="18" cy="54" r="5" fill="white" fill-opacity="0.85"/>

  <!-- Hub node (larger, full opacity) -->
  <circle cx="40" cy="40" r="8" fill="white" fill-opacity="0.97"/>
</svg>
